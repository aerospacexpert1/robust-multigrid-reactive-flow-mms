name: Build IMAT 2026 RMT Extended Abstract

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[IMAT2026] Build RMT extended abstract'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx matplotlib

      - name: Generate Word document
        run: |
          python tools/generate_imat2026_docx.py
          test -s conference/IMAT2026/IMAT2026_RMT_Extended_Abstract.docx

      - name: Inspect DOCX integrity
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          p = "conference/IMAT2026/IMAT2026_RMT_Extended_Abstract.docx"
          with ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt DOCX member: {bad}")
              required = {"word/document.xml", "[Content_Types].xml"}
              missing = required - set(z.namelist())
              if missing:
                  raise SystemExit(f"Missing DOCX members: {missing}")
          print("DOCX integrity PASS")
          PY

      - name: Commit generated document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conference/IMAT2026/IMAT2026_RMT_Extended_Abstract.docx conference/IMAT2026/rmt_mesh_dependence.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate IMAT 2026 RMT extended abstract [skip ci]"
            git push origin main
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMAT2026_RMT_Extended_Abstract
          path: conference/IMAT2026/IMAT2026_RMT_Extended_Abstract.docx
