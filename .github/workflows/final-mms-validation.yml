name: Final MMS A-D validation

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install symbolic and plotting dependencies
        run: python3 -m pip install --disable-pip-version-check sympy numpy matplotlib
      - name: Generate continuous MMS package and apply audited kernel adaptations
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/sp\.simplify(e)/e/g' tools/generate_mms_package.py
          python3 tools/generate_mms_package.py
          python3 tools/postprocess_package.py
          python3 tools/fidelity_patch.py
      - name: Directory, manifest, shell and Python validation
        shell: bash
        run: |
          set -euo pipefail
          root=MMS_BENCHMARKS_ABCD_TRUBA_V1
          for name in Benchmark_A_Pressure_Projection Benchmark_B_Momentum Benchmark_C_Species_Transport Benchmark_D_Thermochemistry; do test -d "$root/$name"; done
          total=0
          for d in "$root"/Benchmark_*; do
            for req in README.md Makefile build.sh run_case.sh submit_all.sh submit_task0.sh submit_index.sh campaign_manifest.csv rebuild_manifest.sh collect_summary.py analyze_scaling.py analyze_mms_order.py check_campaign_status.sh list_unfinished.sh clean_results.sh verify_campaign.sh smoke_test.sh; do test -e "$d/$req"; done
            for dd in src config docs results logs tools; do test -d "$d/$dd"; done
            (cd "$d" && ./verify_campaign.sh)
            n=$(($(wc -l < "$d/campaign_manifest.csv")-1)); test "$n" -eq 300; total=$((total+n))
          done
          test "$total" -eq 1200
          find "$root" -type f \( -name '*.sh' -o -name '*.slurm' \) -print0 | xargs -0 -n1 bash -n
          find "$root" -type f -name '*.py' -print0 | xargs -0 python3 -m py_compile
      - name: Exact manifest count and scheduler assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,glob,collections
          for p in glob.glob('MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*/campaign_manifest.csv'):
              r=list(csv.DictReader(open(p))); assert len(r)==300
              assert collections.Counter(x['stiffness'] for x in r)=={'S1':100,'S2':100,'S3':100}
              assert collections.Counter(x['thread_label'] for x in r)=={'T1':75,'T2':75,'T4':75,'T16':75}
              assert collections.Counter(x['mesh'] for x in r)=={'M1':60,'M2':60,'M3':60,'M4':60,'M5':60}
              assert collections.Counter(x['solver'] for x in r)=={'SG_RBGS':60,'MG2V':60,'MG2W':60,'MG3V':60,'RMT3H':60}
              assert len({(x['stiffness'],x['mesh'],x['thread_label']) for x in r})==60
              mp={'T1':'1','T2':'2','T4':'4','T16':'16'}; assert all(x['threads']==mp[x['thread_label']] for x in r)
          print('MANIFEST_COUNTS_PASS')
          PY
          for f in MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*/*.slurm; do grep -q '#SBATCH --nodes=1' "$f"; grep -q '#SBATCH --ntasks=1' "$f"; grep -q '#SBATCH --cpus-per-task=56' "$f"; grep -q 'SLURM_SUBMIT_DIR' "$f"; grep -q 'run_case.sh.*SLURM_ARRAY_TASK_ID' "$f"; done
          for f in MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*/run_case.sh; do grep -q 'OMP_NUM_THREADS' "$f"; grep -q 'OMP_THREAD_LIMIT' "$f"; done
      - name: Production MG and RMT kernel invariant audit
        run: |
          set -euo pipefail
          for c in MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*/src/mms_solver.c; do
            grep -q 'restrict_2x2_ref' "$c"
            grep -q '\.5625\*cc+.1875' "$c"
            grep -q 'restrict_3x3_ref' "$c"
            grep -q '(2.0/3)\*cc' "$c"
            grep -q 'for(int rep=0;rep<2;rep++)' "$c"
            grep -q 'rbgs(&c,48)' "$c"
            grep -q '0.005\*c.q' "$c"
            grep -q 'rbgs(s,3)' "$c"
          done
          echo KERNEL_INVARIANTS_PASS
      - name: GCC OpenMP build A-D
        run: |
          set -euo pipefail
          for d in MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*; do (cd "$d" && ./build.sh); done
      - name: All five solver smoke on A-D
        run: |
          set -euo pipefail
          for d in MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*; do (cd "$d" && ./smoke_test.sh); done
      - name: Per-variable summary schema and values
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,glob,os
          for d in glob.glob('MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*'):
              p=d+'/results/_smoke/SG_RBGS.csv'; r=list(csv.DictReader(open(p)))[0]
              for k in ['total_relevant_wall_time','continuity_metric','p_L2','u_L2','v_L2','YF_L2','YO_L2','YP_L2','h_L2']: assert k in r
              b=os.path.basename(d)
              if '_A_' in b: assert float(r['p_L2'])>=0
              if '_B_' in b: assert float(r['u_L2'])>0 and float(r['v_L2'])>0
              if '_C_' in b: assert float(r['YF_L2'])>0 and float(r['YO_L2'])>0 and float(r['YP_L2'])>0
              if '_D_' in b: assert float(r['YF_L2'])>0 and float(r['YO_L2'])>0 and float(r['YP_L2'])>0 and float(r['h_L2'])>0
          print('PER_VARIABLE_SUMMARY_PASS')
          PY
      - name: Continuous MMS source finite sanity S1-S3
        run: |
          set -euo pipefail
          for d in MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*; do for s in S1 S2 S3; do OMP_NUM_THREADS=1 OMP_THREAD_LIMIT=1 "$d/build/mms_solver" --Nx 36 --Ny 12 --stiffness "$s" --solver SG_RBGS --out /tmp/source_sanity.csv >/dev/null; done; done
          echo MMS_FINITE_PASS
      - name: Grid-convergence sanity and observed order
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,glob,subprocess,tempfile,os,math
          report=[]
          for d in sorted(glob.glob('MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*')):
              es=[]
              for nx,ny in [(36,12),(72,24),(144,48)]:
                  p=tempfile.mktemp('.csv'); env=os.environ.copy();env['OMP_NUM_THREADS']='1';env['OMP_THREAD_LIMIT']='1'
                  subprocess.run([d+'/build/mms_solver','--Nx',str(nx),'--Ny',str(ny),'--stiffness','S1','--solver','SG_RBGS','--out',p],check=True,env=env,stdout=subprocess.DEVNULL)
                  row=list(csv.DictReader(open(p)))[0]; e=float(row['L2']); os.unlink(p); es.append(e)
              assert all(math.isfinite(e) for e in es),(d,es); assert es[-1]<es[0],(d,es)
              pobs=math.log(es[0]/es[-1])/math.log(4.0) if es[-1] else 99.0
              report.append(f'{os.path.basename(d)} L2={es} aggregate_order={pobs:.6f}')
          open('grid_sanity.txt','w').write('\n'.join(report)+'\n'); print(open('grid_sanity.txt').read())
          PY
      - name: Real solver field and contour sanity
        run: |
          set -euo pipefail
          mkdir -p contour_sanity real_fields
          for d in MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*; do
            b=$(basename "$d"); field="real_fields/${b}.csv"
            OMP_NUM_THREADS=1 OMP_THREAD_LIMIT=1 "$d/build/mms_solver" --Nx 72 --Ny 24 --stiffness S2 --solver SG_RBGS --out /tmp/contour_summary.csv --field-out "$field" >/dev/null
            test -s "$field"
            for m in exact numerical error; do python3 "$d/tools/plot_contours.py" --field "$field" --mode "$m" --output "contour_sanity/${b}_${m}.png"; done
          done
          python3 - <<'PY'
          import glob,hashlib,csv,math
          fs=glob.glob('contour_sanity/*_exact.png'); assert len(fs)==4; assert len({hashlib.sha256(open(f,'rb').read()).hexdigest() for f in fs})==4
          for f in glob.glob('real_fields/*.csv'):
              r=list(csv.DictReader(open(f))); assert r and all(math.isfinite(float(x[k])) for x in r for k in ['exact','numerical','error'])
          print('REAL_CONTOUR_PASS')
          PY
      - name: Output isolation
        run: |
          set -euo pipefail
          for d in MMS_BENCHMARKS_ABCD_TRUBA_V1/Benchmark_*; do test "$(find "$d/results/_smoke" -name '*.csv' | wc -l)" -eq 5; done
      - name: Write validation report
        run: |
          cat > MMS_BENCHMARKS_ABCD_TRUBA_V1/VALIDATION_REPORT.txt <<'EOF'
          MMS_BENCHMARKS_ABCD_TRUBA_V1 — FINAL GITHUB ACTIONS VALIDATION
          =============================================================
          continuous analytic MMS (no b_h=A_h phi_exact): PASS
          shell / Slurm syntax: PASS
          Python syntax: PASS
          GCC -fopenmp A/B/C/D: PASS
          all five solver smoke on A/B/C/D: PASS
          per-variable error summary schema: PASS
          300 solver executions per benchmark / 1200 total: PASS
          60 physical configurations per benchmark / 240 total: PASS
          S1/S2/S3 counts = 100 each per benchmark: PASS
          T1/T2/T4/T16 counts = 75 each per benchmark: PASS
          M1..M5 counts = 60 each per benchmark: PASS
          SG_RBGS/MG2V/MG2W/MG3V/RMT3H counts = 60 each per benchmark: PASS
          OMP manifest mapping 1/2/4/16: PASS
          Slurm nodes=1 ntasks=1 cpus-per-task=56: PASS
          SLURM_SUBMIT_DIR fix: PASS
          MG2 2x2 restriction + source bilinear weights audit: PASS
          MG3 3x3 restriction + source 3:1 bilinear weights audit: PASS
          RMT 3x3 shifted-family / repeats=2 / coarseSweeps=48 / omega=0.005 / postSmooth=3 audit: PASS
          continuous source finite sanity S1-S3: PASS
          grid-convergence sanity: PASS
          solver-produced exact/numerical/error field contours: PASS
          A-D exact contour visual distinction hash check: PASS
          output isolation: PASS
          EOF
          cat grid_sanity.txt >> MMS_BENCHMARKS_ABCD_TRUBA_V1/VALIDATION_REPORT.txt
      - name: ZIP integrity
        run: |
          set -euo pipefail
          rm -f MMS_BENCHMARKS_ABCD_TRUBA_V1.zip
          zip -qr MMS_BENCHMARKS_ABCD_TRUBA_V1.zip MMS_BENCHMARKS_ABCD_TRUBA_V1
          unzip -t MMS_BENCHMARKS_ABCD_TRUBA_V1.zip | tee unzip_test.txt
          grep -q 'No errors detected' unzip_test.txt
      - name: Fresh extraction verify build and smoke
        run: |
          set -euo pipefail
          t=$(mktemp -d); unzip -q MMS_BENCHMARKS_ABCD_TRUBA_V1.zip -d "$t"; r="$t/MMS_BENCHMARKS_ABCD_TRUBA_V1"
          for d in "$r"/Benchmark_*; do (cd "$d" && ./verify_campaign.sh && ./build.sh && ./smoke_test.sh); done
          echo 'ZIP integrity: PASS' >> MMS_BENCHMARKS_ABCD_TRUBA_V1/VALIDATION_REPORT.txt
          echo 'fresh extraction verify/build/all-solver smoke: PASS' >> MMS_BENCHMARKS_ABCD_TRUBA_V1/VALIDATION_REPORT.txt
          rm -rf "$t" MMS_BENCHMARKS_ABCD_TRUBA_V1.zip
          zip -qr MMS_BENCHMARKS_ABCD_TRUBA_V1.zip MMS_BENCHMARKS_ABCD_TRUBA_V1
          unzip -t MMS_BENCHMARKS_ABCD_TRUBA_V1.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MMS_BENCHMARKS_ABCD_TRUBA_V1
          path: MMS_BENCHMARKS_ABCD_TRUBA_V1.zip
          if-no-files-found: error
      - name: Publish validated ZIP and report
        run: |
          set -euo pipefail
          mkdir -p dist
          cp MMS_BENCHMARKS_ABCD_TRUBA_V1.zip dist/MMS_BENCHMARKS_ABCD_TRUBA_V1.zip
          cp MMS_BENCHMARKS_ABCD_TRUBA_V1/VALIDATION_REPORT.txt dist/VALIDATION_REPORT.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'Publish final production-fidelity MMS A-D ZIP [skip ci]' || true
          git push
